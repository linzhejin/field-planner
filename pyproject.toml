[project]
name = "nongshi-window"
version = "0.1.0"
description = "农时窗口油菜苗期农事规划助手"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.50,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nongshi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
